name: docs

on:
  push:
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Sass
        run: npm install -g sass

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Generate the site
        run: composer install --no-interaction && php generate_docs.php
